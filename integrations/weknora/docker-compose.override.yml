# 放到 WeKnora 的 docker-compose.yml 同目录，与它一起启动：
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# 同目录 .env 中设置 PAGESEAM_URL、PAGESEAM_API_KEY，并在 SSRF_WHITELIST 中加上 parser-bridge
services:
  # 以 MinerU 旧版接口（/file_parse）把 PageSeam 接成 WeKnora 的解析引擎
  # 只接入 WeKnora 内部网络，不映射宿主机端口；只用标准库，脚本只读挂载进官方镜像，不需要构建
  parser-bridge:
    image: python:3.12-slim
    container_name: WeKnora-parser-bridge
    command: ["python", "-u", "/app/bridge.py"]
    volumes:
      - ./parser-bridge/bridge.py:/app/bridge.py:ro
    environment:
      - PAGESEAM_URL=${PAGESEAM_URL}
      - PAGESEAM_API_KEY=${PAGESEAM_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - WeKnora-network
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
